name: Fly-in test-main audit

on:
  push:
    branches:
      - test-main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run unit tests
        run: poetry run pytest -q
      - name: Run all provided maps
        run: poetry run python tests/test_all_maps_terminal.py --output-dir /tmp/flyin-audit-maps
      - name: Flake8
        run: poetry run flake8 . --exclude=.venv
      - name: Mypy
        run: poetry run mypy . --warn-return-any --warn-unused-ignores --ignore-missing-imports --disallow-untyped-defs --check-untyped-defs --exclude .venv
